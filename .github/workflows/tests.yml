name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    # macOS on purpose: tutar/kareler.py calls ffmpeg at the Homebrew path it was measured with.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg
      - run: test -x /opt/homebrew/bin/ffmpeg
      - run: python3 -m unittest discover -s tests
